services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_secret
      POSTGRES_DB: sentinel_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_db"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: sentinel_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass sentinel_redis_secret
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "sentinel_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel_backend
    # Comente ou remova o restart temporariamente para ele não rodar em loop se falhar
    restart: unless-stopped
    entrypoint: ["node"]
    command: ["/app/dist/main.js"]
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://sentinel:sentinel_secret@postgres:5432/sentinel_db?sslmode=disable
      PGSSLMODE: "disable"
      
      # FORÇA O TYPEORM A CRIAR AS TABELAS QUE ESTÃO FALTANDO SOZINHO:
      TYPEORM_SYNCHRONIZE: "true"
      DB_SYNCHRONIZE: "true"
      
      REDIS_URL: redis://:sentinel_redis_secret@redis:6379
      JWT_SECRET: change_this_jwt_secret_in_production_min_32_chars
      JWT_EXPIRES_IN: 24h
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  frontend: 
      build:
        context: ./frontend
        dockerfile: Dockerfile
        args:
          - NEXT_PUBLIC_API_URL=http://sentinel-backend:3001
      container_name: sentinel_frontend
      restart: unless-stopped
      environment:
        - NEXT_PUBLIC_API_URL=http://localhost:3001
        - NEXT_PUBLIC_WS_URL=ws://localhost:3001
      ports:
        - "3000:3000"
      depends_on:
        - backend


volumes:
  postgres_data:
  redis_data:
